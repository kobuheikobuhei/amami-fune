    role: backup
    confidence: A
    verified: false
    robots: unverified
    notes: 鹿児島県の名瀬港クルーズ情報

# ── 表示用リンク（監視しない）────────────────────────
# 仕様Q10: 空路は監視せず、常設ページにリンクのみ置く
# ── 配船予定（本来どの船が動くか）──────────────────
# いずれもPDFで、HTMLで取れる形の資料は存在しない。
# 現時点ではリンクとして読者に案内するのみ。解析は段階的に行う。
#
#  マリックスライン 年間  月ごとに船名と出港日の数字が並ぶ。最も解析しやすい
#  マルエーフェリー 年間  記号（●○入）の位置で日付に対応。数が合わない箇所あり
#  第一海運 月次        ○印と便番号。URLが年月から作れる唯一の資料
#
# 第一海運の配船予定表は内部確認用に限る。読者へは案内しない。
# マルエーフェリー・奄美海運と同じグループの物流会社が公開している資料で、
# 複数社の配船を1枚にまとめた唯一のものだが、読者から見れば別会社のサイトであり、
# 運航会社の公式発表という位置づけも曖昧になる。
# 読者には各運航会社の公式ページのみを案内する。

# 配船予定（どの船がいつ鹿児島を出るか）
#
# 「船のドック入り」と「便の運休」は別物で、ドック中の船の便は別の船が担う。
# それを読者に伝えるには、日付ごとの配船が要る。
#
# 使うのは各社が自ら出しているものだけ。第一海運の配船予定表は
# 突き合わせの参考にとどめ、読者には案内しない。
fleet_schedules:
  - operator: marue
    label: 2026年度 運航スケジュール（鹿児島航路）
    page: https://www.aline-ferry.com/kagoshima/time/
    kind: pdf
    role: primary
    note: |
      記号の表。●が鹿児島発、○が那覇発、入が入渠。
      PDFのURLはハッシュ値のため毎回ページから探す。
      文字を順に取り出すと空欄が失われて日付とずれるため、座標で列に割り当てる。
  - operator: marix
    label: 時刻表と運賃を検索
    page: https://marixline.com/price_schedule/
    kind: form
    role: primary
    note: |
      日付と区間を送ると、その日の時刻表と「運航予定の船」を返す。
      運航しない日は時刻表を返さない。会社自身が日付ごとに公表している。
      相手先への負荷を避けるため、呼ぶのは1日1回・必要な日数だけにする。
  - operator: marue
    label: 2026年度 運航スケジュール（鹿児島航路）／上期
    page: https://www.aline-ferry.com/kagoshima/time/
    kind: pdf
    role: reference
    note: |
      4隻（あけぼの・波之上・きかい・あまみ）の鹿児島発日と、両航路の公式時刻を1枚に載せる。
      時刻の裏付けに使った。上期・下期で分かれるため、自動処理の土台にはしていない。
  - operator: multi
    label: 配船予定表（第一海運・月次）
    page: https://www.daiichikaiun.co.jp/
    kind: pdf
    role: internal
    note: |
      マルエーと奄美海運の全船を1枚に。便番号とドック・運休も明記される。
      内部の確認にのみ使い、読者には案内しない（運航会社自身の発表ではないため）。
reference_links:
  - label: JAL・JAC 運航状況
    url: https://www.jal.co.jp/jp/ja/dom/status/
  - label: Peach 運航状況
    url: https://www.flypeach.com/jp/lp/flight-status

  - label: 船舶位置（AIS）冒険あそび倉庫
    url: https://www.bouken-asobi.com/map_ais.html
    note: 位置情報は遅延や誤差があり、航行の判断には使えない旨が提供元に明記されている