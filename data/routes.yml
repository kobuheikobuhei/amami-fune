# 航路・船社・船名マスタ
# 更新: 2026-09-04
#
# enabled: false にすると、その航路の収集・掲載を即座に停止できる（仕様Q36）
# phase:   1 = MVP対象 / 2 = フェーズ2 / 3 = フェーズ3
# verified: 公式サイトで寄港地・船名を確認済みか。false のものは実装時に要確認

version: 1
updated: 2026-09-04

operators:
  marue:
    name: マルエーフェリー株式会社
    site: https://www.aline-ferry.com/kagoshima/
    references:
      - label: 時刻表・年間スケジュール
        url: https://www.aline-ferry.com/kagoshima/time/
      - label: 月ごとの配船予定表（同じグループの第一海運が公開）
        url: https://www.daiichikaiun.co.jp/
    note: 奄美海運と共通のサイト（A"LINE）で運航状況を配信

  marix:
    name: マリックスライン株式会社
    site: https://marixline.com/
    references:
      - label: 運賃・時刻表・年間運航スケジュール
        url: https://marixline.com/price_schedule/#timetable

  amamikaiun:
    name: 奄美海運株式会社
    site: https://www.aline-ferry.com/amami/
    references:
      - label: 時刻表
        url: https://www.aline-ferry.com/amami/time/
      - label: 月ごとの配船予定表（同じグループの第一海運が公開）
        url: https://www.daiichikaiun.co.jp/
    note: マルエーフェリーと共通サイト

  setouchi:
    name: 瀬戸内町（町営定期船）
    site: https://www.town.setouchi.lg.jp/cho/kurashi/kotsu/senpaku/index.html
    references:
      - label: 時刻表
        url: https://www.town.setouchi.lg.jp/senpaku/jikokuhyou.html
    note: 運航状況は公式サイトに掲載されず、X と防災情報メールでのみ配信される

  kyodogumi:
    name: 共同組海運株式会社
    site: https://www.kyoudougumikaiun.co.jp/
    references:
      - label: 配船予定表
        url: https://www.kyoudougumikaiun.co.jp/page2
    note: 貨物船（RORO）。ホームページに「船舶動静」欄がある

routes:
  - id: marue-main
    name: 鹿児島〜奄美〜沖縄（マルエーフェリー）
    short: マルエーフェリー
    operator_id: marue
    enabled: true
    phase: 1
    verified: true
    ships: [フェリーあけぼの, フェリー波之上]
    ports: [鹿児島, 名瀬, 亀徳, 和泊, 与論, 本部, 那覇]
    amami_ports: [名瀬]

  - id: marix-main
    name: 鹿児島〜奄美〜沖縄（マリックスライン）
    short: マリックスライン
    operator_id: marix
    enabled: true
    phase: 1
    verified: true
    ships: [クイーンコーラルクロス, クイーンコーラルプラス]
    ports: [鹿児島, 名瀬, 亀徳, 和泊, 与論, 本部, 那覇]
    amami_ports: [名瀬]

  - id: amamikaiun-kikai
    name: 鹿児島〜喜界〜名瀬〜古仁屋〜平土野〜知名（奄美海運）
    short: 奄美海運
    operator_id: amamikaiun
    enabled: true
    phase: 1
    verified: true
    ships: [フェリーきかい, フェリーあまみ]
    ports: [鹿児島, 喜界, 名瀬, 古仁屋, 平土野, 知名]
    amami_ports: [名瀬, 古仁屋]
    notes: |
      フェリーあまみの運休中は、フェリーきかいが週3便体制で運航しています。
      下り便は鹿児島発の月・水・金、上り便は平土野発の火・木・土です。
      最新の時刻は公式サイトでご確認ください。

  - id: setouchi-kakeroma
    name: 古仁屋〜加計呂麻島（フェリーかけろま）
    short: 加計呂麻
    operator_id: setouchi
    enabled: true
    phase: 3
    verified: false
    ships: [フェリーかけろま]
    ports: [古仁屋, 生間, 瀬相]
    amami_ports: [古仁屋]
    notes: 寄港地名は公式時刻表で要確認

  - id: setouchi-setonami
    name: 古仁屋〜請島〜与路島（せとなみ）
    short: 請・与路
    operator_id: setouchi
    enabled: true
    phase: 3
    verified: false
    ships: [せとなみ]
    ports: [古仁屋, 請阿室, 池地, 与路]
    amami_ports: [古仁屋]
    notes: 寄港地名は公式時刻表で要確認

  - id: kyodogumi-main
    name: 共同組海運（鹿児島〜奄美群島）
    operator_id: kyodogumi
    short: 共同組海運
    enabled: true
    phase: 2
    verified: true
    ships: [みさきⅡ, つばさ]
    ports: [鹿児島, 名瀬, 徳之島, 喜界島, 沖永良部]
    amami_ports: [名瀬]
    cargo_only: true
    notes: |
      貨物船です。旅客は乗船できません。
      Aコース（鹿児島〜名瀬〜徳之島〜喜界島）とBコース（鹿児島〜名瀬〜徳之島〜沖永良部）があります。
      公式の発表はコースを区別していないため、まとめて掲載しています。

  - id: cruise-naze
    name: 名瀬港 クルーズ船寄港
    operator_id: null
    enabled: true
    phase: 3
    verified: true
    ships: []
    ports: [名瀬]
    amami_ports: [名瀬]
    notes: 速報ではなく週次・月次の予定まとめとして扱う（仕様Q8）
