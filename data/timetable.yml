# 鹿児島〜奄美群島〜沖縄 定期航路の時刻。
#
# マルエーフェリーとマリックスラインが1日1便を分け合う航路で、
# 両社の公式が同じ時刻を掲げている。下り・上りとも両方で確認した。
#
#   マルエーフェリー「乗り場とアクセス」下り／上りの入港・出港時間の表
#     https://www.aline-ferry.com/kagoshima/access/
#     時刻表のページはPDFの配布だけで、時刻そのものはこちらに載っている。
#   マルエーフェリー「2026年度 運航スケジュール（鹿児島航路）／上期」（下り）
#   マリックスライン「年間運航スケジュール（2026年度）」（下り・上り）
#
# day は出港日を1日目とした通し日数。

kagoshima_okinawa_down:
  label: 下り便
  direction: down
  summary: 鹿児島 → 奄美群島 → 沖縄
  sources:
