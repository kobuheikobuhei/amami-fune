# 奄美海運（鹿児島〜喜界〜奄美大島〜徳之島）
#
# フェリーあまみが機関故障で運休中のため、フェリーきかいが週3便で走っている。
# 通常の年間配船表を使うと、走っていない船を走っていることにしてしまう。
# 公式の「フェリーきかい週3便運航のご案内」だけを見る。
#
#   https://www.aline-ferry.com/amami/time/
#
# 鹿児島の乗り場は北埠頭で、マルエー・マリックスの鹿児島新港とは別。
# 知名港行きは令和7年6月より休止している。
#
# 相手が1社しかなく会社どうしの突き合わせができないため、
# 案内そのものが前提どおりかを毎回確かめる（src/fleet/amamikaiun.js）。

