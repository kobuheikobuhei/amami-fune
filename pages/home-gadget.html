<div id="amami-now" style="display:none">
  <p id="amami-now-fallback" style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:10px 14px;margin:0 0 16px">
    <a href="https://amami-fune.blogspot.com/p/blog-page_578.html" style="color:#1d4ed8;font-weight:bold;text-decoration:none">運航状況を見る</a>
  </p>
</div>

<script>
/* トップページにだけ、いま動いている船を表示する。
   Bloggerのガジェットは全ページに出るため、ホーム以外では自身を隠す。
   ページの特定はURLで行う。日本語の題名で照合すると、貼り付けの過程で
   文字が変わったときに一致しなくなるため。
   読み込みに失敗しても、リンクは残るので読者は到達できる。 */
(function () {
  var PAGE_PATH = '/p/blog-page_578.html';
  var MARK = '<div id="daily-now">';
  var HEADING = '\u73fe\u5728\u306e\u904b\u822a';

  var box = document.getElementById('amami-now');
  if (!box) return;

  // ホーム以外では何も出さない。
  // 記事や固定ページには、上部のメニューから移動してもらう。
  var path = location.pathname;
  if (path !== '/' && path !== '') return;

  box.style.display = '';

  function note(text, color) {
    var el = document.getElementById('amami-now-note');
    if (!el) {
      el = document.createElement('span');
      el.id = 'amami-now-note';
      el.style.marginLeft = '10px';
      el.style.fontSize = '0.85em';
      var fb = document.getElementById('amami-now-fallback');
      if (fb) fb.appendChild(el);
    }
    el.style.color = color || '#666';
    el.textContent = text;
  }

  /* 目印の div から、対応する閉じ div までを取り出す。
     中に div が入れ子になっているため、数を数えないと途中で切れる。 */
  function sliceBlock(html) {
    var start = html.indexOf(MARK);
    if (start < 0) return null;
    var from = start + MARK.length;
    var re = /<\/?div\b[^>]*>/g;
    re.lastIndex = from;
    var depth = 1;
    var m;
    while ((m = re.exec(html)) !== null) {
      if (m[0].charAt(1) === '/') {
        depth--;
        if (depth === 0) return html.slice(from, m.index);
      } else {
        depth++;
      }
    }
    return null;
  }

  note('\u8aad\u307f\u8fbc\u307f\u4e2d\u2026');

  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/feeds/pages/default?alt=json&max-results=50', true);
  xhr.onerror = function () { note('NG: network', '#b91c1c'); };

  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) { note('NG: http ' + xhr.status, '#b91c1c'); return; }
    try {
      var data = JSON.parse(xhr.responseText);
      var entries = (data.feed && data.feed.entry) || [];
      var target = null;

      for (var i = 0; i < entries.length && !target; i++) {
        var links = entries[i].link || [];
        for (var k = 0; k < links.length; k++) {
          if (links[k].rel === 'alternate' && links[k].href &&
              links[k].href.indexOf(PAGE_PATH) >= 0) { target = entries[i]; break; }
        }
      }

      if (!target) { note('NG: page not found (' + entries.length + ' entries)', '#b91c1c'); return; }

      var inner = sliceBlock(target.content ? target.content.$t : '');
      if (inner === null) { note('NG: marker missing', '#b91c1c'); return; }

      box.innerHTML =
        '<div style="border:2px solid #1d4ed8;border-radius:8px;padding:14px 18px;margin:0 0 24px;background:#fff">' +
        '<h2 style="margin:0 0 8px;font-size:1.15em">' + HEADING + '</h2>' +
        inner +
        '<p style="margin:10px 0 0"><a href="' + PAGE_PATH + '" style="color:#1d4ed8;font-weight:bold;text-decoration:none">' +
        '\u904b\u822a\u72b6\u6cc1\u306e\u30da\u30fc\u30b8\u3078</a></p>' +
        '</div>';
    } catch (e) {
      note('NG: parse', '#b91c1c');
    }
  };

  xhr.send();
})();
</script>
