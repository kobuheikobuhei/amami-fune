name: 船舶動静の監視

# 毎時0分に起動を試み、起動できたら節目の時刻まで待ちながら繰り返す。
#
# GitHub Actions の定期実行は混雑時に遅延・間引きされる。15分ごとを指定して
# いたが、実測では1日5〜6回・平均3.7時間おきしか起動しなかった。1日1回の
# 点検も3時間半遅れており、頻度の細かい指定ほど落とされやすい。
# 起動そのものは相手任せなので、起動できた時間を無駄にしない作りにする。
#
# 待ち時間は機械的な刻みではなく、意味のある時刻から決める。船が出る時刻と
# 着く時刻は公式の時刻表として持っており（data/timetable.yml）、発表が出やすい
# 時間帯も分かっている。12分ごとに起きていた頃は、18:00に鹿児島を出た船が
# 18:11まで「次の出港」のまま残っていた。
#
# 持ち時間は5時間。起動が1日5〜6回しかないため、1回で夕方から夜、あるいは
# 朝をまるごと覆えるようにする。発表が出るのは当日朝と前日の夕方から夜で、
# 深夜はほぼ何も起きない。
#
# 終わる条件は2つ。次の節目が持ち時間を超えるとき、そして次の節目が
# 遠すぎるとき（MAX_WAIT_MINUTES＝90分）。深夜に眠って1回だけ見張るより、
# 終了して実行環境を返すほうがよい。
#
# 荒天モードでは10分ごとに節目が立つので、待ちが上限に達せず夜通し見張る。
# 平常時の夜は空くが、その時間帯に出る発表はほとんど無い。
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '平常モードの間引きを無視して実行する'
        type: boolean
        default: false
      test_notify:
        description: 'メール通知の動作確認（テスト通知を1件送る）'
        type: boolean
        default: false

# 1回の起動が最長5時間走るため、次の起動と必ず重なる。
# 重なると同じ台帳を見た2つのジョブが同じ欠航を二度投稿しかねないので、
# 打ち消さずに順番待ちさせる。前のジョブが終わり次第、次が始まる。
#
# この結果、手動実行（workflow_dispatch）も走っているジョブの後ろで待つ。
# すぐ動かしたいときは、Actions の画面で走っているジョブを先に止める。
# 打ち消しを自動にはしない。投稿した直後に殺されると台帳を残せず、
# 同じ欠航をもう一度投稿することになるため。
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # 条件式の中では secrets を直接参照できない。
    # メール通知が未設定のときに通知手順を飛ばせるよう、ここで環境変数へ移す。
    env:
      MAIL_CONFIGURED: ${{ secrets.MAIL_USERNAME != '' }}
      # 1回の起動を何分まで生かすか。長くすれば切れ目が減るが、
      # そのぶん実行環境を占有する。ジョブ1本の上限は6時間。
      MAX_MINUTES: 300
      # 次の節目までこれ以上あるなら、待たずに終了する。
      # 空き時間を眠って過ごさないため。
      MAX_WAIT_MINUTES: 90

    steps:
      - uses: actions/checkout@v5
        with:
          # 既定では「起動がかかった時点」のコミットを取り出す。順番待ちの間に
          # 前のジョブが20分ごとに state を保存しているため、それでは古い台帳で
          # 走り出すことになり、すでに投稿した欠航をもう一度投稿しかねない。
          # 枝の名前で指定すると、実際に走り出した時点の先頭を取る。
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 依存関係のインストール
        run: npm install --no-audit --no-fund

      - name: 収集と公開
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          PHASE: ${{ vars.PHASE || '1' }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
          # 値そのものは使わない。登録の有無と長さを診断に残すためだけに渡す。
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          git config user.name  "amami-fune-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p state tmp
          : > tmp/notify-all.md
          failed=0
          round=0
          deadline=$(( $(date +%s) + MAX_MINUTES * 60 ))

          while true; do
            round=$(( round + 1 ))
            echo "──── ${round} 周目（$(date -u +%H:%MZ)）────"

            if ! node src/main.js ${{ inputs.force && '--force' || '' }}; then
              echo "この周は失敗しました。残りの周は続けます。"
              failed=1
            fi

            # 通知は周ごとに上書きされるため、消える前に集めておく。
            if [ -s state/notify.md ]; then
              cat state/notify.md >> tmp/notify-all.md
              printf '\n' >> tmp/notify-all.md
            fi

            # state/ は実行間で引き継ぐ必要がある。台帳を失うと、すでに投稿した
            # 欠航をもう一度投稿することになる。周ごとに保存し、途中で
            # ジョブが止まってもそこまでの結果を残す。
            git add -A state/
            if git diff --staged --quiet; then
              echo "状態に変化なし"
            else
              git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ) の収集結果"
              if ! (git pull --rebase --autostash && git push); then
                echo "状態の保存に失敗しました。次の周でやり直します。"
                # 取り込みが途中で止まったまま残ると、以降の周は何をしても
                # 保存できない。片付けて、土台だけを相手の先頭に載せ替える。
                # 集めた内容（作業ツリー）はそのまま残すので、次の周が
                # まとめて保存し直す。台帳を捨てると投稿済みの欠航を
                # もう一度投稿することになるため、向こうを丸ごと採らない。
                git rebase --abort 2>/dev/null || true
                git fetch origin "$GITHUB_REF_NAME" && git reset --soft FETCH_HEAD
              fi
            fi

            # 次の節目を、公式の時刻表と発表の出やすい時間帯から決める。
            # 取れなかったときは10分後に置く（止めるより粗く続ける）。
            next=$(node src/tools/next-check.js) || next="600 ?? 既定の待ち"
            wait_seconds=${next%% *}
            label=${next#* }

            if [ "$wait_seconds" -gt $(( MAX_WAIT_MINUTES * 60 )) ]; then
              echo "次の節目（${label}）は遠すぎます。実行環境を返して次の起動を待ちます。"
              break
            fi

            if [ $(( $(date +%s) + wait_seconds )) -ge "$deadline" ]; then
              echo "次の節目（${label}）はこのジョブの持ち時間を超えます。ここで終わります。"
              break
            fi

            echo "次の節目 ${label} まで ${wait_seconds} 秒待ちます"
            sleep "$wait_seconds"
          done

          exit "$failed"

      - name: 通知の要否を判定
        id: notify
        if: always()
        run: |
          if [ -s tmp/notify-all.md ] && [ -n "$(tr -d '[:space:]' < tmp/notify-all.md)" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: メール通知
        if: always() && steps.notify.outputs.send == 'true' && env.MAIL_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 船舶動静ボット
          to: ${{ secrets.MAIL_TO }}
          subject: '[船舶動静] 確認が必要な項目があります'
          body: file://tmp/notify-all.md

      # 収集そのものが落ちた場合も知らせる。
      # 気づかないまま止まっているのが最も危険な状態のため。
      - name: 実行失敗の通知
        if: failure() && env.MAIL_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 船舶動静ボット
          to: ${{ secrets.MAIL_TO }}
          subject: '[船舶動静] 監視ジョブが失敗しました'
          body: |
            監視ジョブが異常終了しました。
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
